# Dependabot keeps our pinned dependencies fresh across four ecosystems. The
# CI security gates remain the source of truth — Dependabot only proposes PRs:
#   * github-actions — rewrites the SHA pin and trailing `# vX.Y.Z` comment on
#     every `uses:` reference in .github/workflows/.
#   * uv — lockfile bumps for pyproject.toml + uv.lock, grouped into runtime
#     deps vs dev/docs tooling. These *version* updates cover only deps declared
#     in pyproject.toml; indirect deps ride Dependabot SECURITY updates instead
#     (see the note on the uv entry). pip-audit still FAILS CI on any
#     known-vulnerable runtime dep, so security never rides on bot cadence.
#     Django is major/minor-ignored below: its LTS cap would otherwise hide 5.2.x
#     patch releases from the bot entirely (see the comment on the rule).
#   * docker — base-image bumps for the Dockerfile; the Trivy gate still fails
#     the build on a vulnerable base. The dhi.io bases sit behind a credentialed
#     registry, so the `dhi-io` registry below needs DOCKER_HUB_USERNAME /
#     DOCKER_HUB_TOKEN as DEPENDABOT secrets (repo Settings → Secrets and
#     variables → Dependabot — a scope SEPARATE from Actions secrets; the same
#     names must exist there too). Until those exist, dhi.io updates error in
#     the Dependabot logs while the public ghcr.io/astral-sh/uv base still
#     updates fine.
#   * docker-compose — dev-stack image bumps in docker-compose.yml (kanidm,
#     prometheus, grafana; postgres/valkey ride major-only tags on purpose —
#     the Postgres major is a deliberate, migration-planned upgrade).
version: 2
registries:
  dhi-io:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKER_HUB_USERNAME}}
    password: ${{secrets.DOCKER_HUB_TOKEN}}
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gha:
        patterns: ["*"] # one grouped PR per week, not one per action
    commit-message:
      prefix: "build"
      include: scope # → "build(deps): bump …" (conventional commits)

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # No `allow:` block, on purpose. Version updates therefore default to direct
    # deps only — deliberate: indirect *freshness* is not wanted as weekly PR
    # churn. Indirect deps are covered by Dependabot SECURITY updates instead,
    # whose default scope is every dependency in the lock file, so a vulnerable
    # transitive still gets its own PR (e.g. cryptography, which arrives via
    # mozilla-django-oidc and pyjwt[crypto] and never appears in pyproject.toml).
    # DO NOT add `allow: - dependency-type: direct` to "document" the behaviour
    # above: `allow` applies to BOTH update types, so an explicit `direct` would
    # silently switch that security path off. Alerts + security updates are a
    # repo-settings toggle rather than a file — docs/operations/maintenance.md §2.
    ignore:
      # Django rides the 5.2 LTS line (pyproject.toml `django>=5.2.x,<5.3` — the
      # floor moves with each accepted bump, the `<5.3` cap does not).
      # Without this, the newest Django on PyPI sits outside that range and
      # Dependabot reports NO update at all instead of the newest permitted
      # one — 5.2.16 (2026-07-07) was silently skipped by both the 2026-07-14
      # and 2026-07-28 runs. Capping the update types here makes 5.2.x the
      # newest version it considers. The `<5.3` cap stays in pyproject.toml as
      # defense-in-depth for hand-run `uv lock`.
      - dependency-name: "Django"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      python-prod:
        dependency-type: production
        patterns: ["*"]
      python-dev:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: docker
    directory: "/"
    registries:
      - dhi-io
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"] # one grouped PR for the dev-stack images
    commit-message:
      prefix: "build"
      include: scope
